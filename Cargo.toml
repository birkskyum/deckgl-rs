[workspace]
resolver = "2"
members = [
  "crates/mathgl",
  "crates/lumagl",
  "crates/deckgl",
  "crates/deckgl-layers",
  "crates/deckgl-json",
  "crates/deckgl-ffi",
  "examples",
]
# Standalone crates, built on their own:
# - maplibre-ffi needs the native MapLibre library and a sibling maplibre-native-ffi checkout
# - web is a wasm32 cdylib, built by examples/web/build.sh
# - mln needs a checkout of https://github.com/louwers/mln-rs next to this repository
# - web-mln is a wasm32 cdylib built by examples/web-mln/build.sh
exclude = ["examples/maplibre-ffi", "examples/web", "examples/mln", "examples/web-mln"]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.94"
license = "MIT OR Apache-2.0"
authors = ["Birk Skyum"]
repository = "https://github.com/birkskyum/visgl-rs"

[workspace.dependencies]
mathgl = { path = "crates/mathgl" }
lumagl = { path = "crates/lumagl" }
deckgl = { path = "crates/deckgl" }
deckgl-layers = { path = "crates/deckgl-layers" }
deckgl-json = { path = "crates/deckgl-json" }

wgpu = "30"
naga = { version = "30", features = ["wgsl-in", "glsl-out"] }
glam = "0.33"
bytemuck = { version = "1", features = ["derive"] }
regex = "1"
thiserror = "2"
pollster = "0.4"
# `std::time::Instant` panics on wasm32; this is `std::time` everywhere else and
# `performance.now()` in a browser.
web-time = "1"
image = { version = "0.25", default-features = false, features = ["png"] }
tracing = { version = "0.1", features = ["log"] }
rayon = "1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
arrow-array = "59"
arrow-schema = "59"
arrow-buffer = "59"
arrow-select = "59"
arrow-ipc = "59"
parquet = { version = "59", default-features = false, features = ["arrow", "snap", "zstd", "lz4", "brotli", "flate2-zlib-rs"] }
flatgeobuf = { version = "6", default-features = false }
geozero = { version = "0.15", default-features = false, features = ["with-geojson"] }
earcutr = "0.5"
fontdue = "0.9"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 2
