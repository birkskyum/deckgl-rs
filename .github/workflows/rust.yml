name: rust

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: fmt, clippy, test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    # The GPU tests run against lavapipe. On ubuntu-26.04, which ubuntu-latest rolled
    # to in October 2026 along with mesa-vulkan-drivers 25.2.8 -> 26.0.8, they SIGSEGV
    # when libtest runs them in parallel. Every one of them passes on that same image
    # one at a time, so it is concurrent use of the driver that falls over, not any
    # test it cannot render. Linux therefore runs the suite serially; macOS and Windows
    # keep their threads.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Install a software Vulkan driver for GPU tests
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y mesa-vulkan-drivers libvulkan1 vulkan-tools
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace
        if: runner.os != 'Linux'
      # Serialised: see the note on this job.
      - run: cargo test --workspace -- --test-threads=1
        if: runner.os == 'Linux'
      - name: Render the example scene
        run: cargo run --release --bin texture_render -- target/texture-render.png
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: texture-render-${{ matrix.os }}
          path: target/texture-render.png
          if-no-files-found: ignore

  wasm:
    name: wasm32 build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      # The core crates build for the web through wgpu's WebGPU backend. The layer and JSON
      # crates need `s2-cells` off (the s2 crate has no wasm build) and `parallel` off (no
      # threads); `fetch` works, loading through the browser's own rather than ureq.
      - run: cargo build --target wasm32-unknown-unknown -p mathgl-rs -p lumagl-rs -p deckgl-rs
      - run: cargo build --target wasm32-unknown-unknown -p deckgl-rs-layers --no-default-features
      - run: cargo build --target wasm32-unknown-unknown -p deckgl-rs-json --no-default-features
      # With `fetch` the loading goes through the browser's own, so no ureq and no threads
      - run: cargo build --target wasm32-unknown-unknown -p deckgl-rs-json --no-default-features --features fetch
      # The browser example, on both backends
      - run: cargo build --target wasm32-unknown-unknown
        working-directory: examples/web
      - run: cargo build --target wasm32-unknown-unknown --features webgl
        working-directory: examples/web

  coverage:
    name: coverage (ubuntu)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@cargo-llvm-cov
      - name: Install a software Vulkan driver for GPU tests
        run: sudo apt-get update && sudo apt-get install -y mesa-vulkan-drivers libvulkan1 vulkan-tools
      - name: Test with coverage
        # Serialised for the same reason as the check job.
        run: cargo llvm-cov --workspace --lcov --output-path target/lcov.info -- --test-threads=1
      - name: Coverage summary
        run: cargo llvm-cov report --summary-only
      - uses: actions/upload-artifact@v4
        with:
          name: coverage-lcov
          path: target/lcov.info
