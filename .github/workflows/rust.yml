name: rust

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: fmt, clippy, test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    # The GPU tests run against lavapipe. ubuntu-latest rolled from 24.04 to 26.04 in
    # October 2026, which brought mesa-vulkan-drivers 25.2.8 -> 26.0.8, and the layer
    # render tests SIGSEGV inside the 26.0 driver. The same tests pass on macOS (Metal)
    # and Windows, and no shader changed, so this is pinned to the last image known to
    # run them until the crash under Mesa 26 is tracked down.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Install a software Vulkan driver for GPU tests
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y mesa-vulkan-drivers libvulkan1 vulkan-tools
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace
      - name: Render the example scene
        run: cargo run --release --bin texture_render -- target/texture-render.png
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: texture-render-${{ matrix.os }}
          path: target/texture-render.png
          if-no-files-found: ignore

  wasm:
    name: wasm32 build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      # The core crates build for the web through wgpu's WebGPU backend. The layer and JSON
      # crates need `s2-cells` off (the s2 crate has no wasm build) and `parallel` off (no
      # threads); `fetch` works, loading through the browser's own rather than ureq.
      - run: cargo build --target wasm32-unknown-unknown -p mathgl-rs -p lumagl-rs -p deckgl-rs
      - run: cargo build --target wasm32-unknown-unknown -p deckgl-layers --no-default-features
      - run: cargo build --target wasm32-unknown-unknown -p deckgl-json --no-default-features
      # With `fetch` the loading goes through the browser's own, so no ureq and no threads
      - run: cargo build --target wasm32-unknown-unknown -p deckgl-json --no-default-features --features fetch
      # The browser example, on both backends
      - run: cargo build --target wasm32-unknown-unknown
        working-directory: examples/web
      - run: cargo build --target wasm32-unknown-unknown --features webgl
        working-directory: examples/web

  coverage:
    name: coverage (ubuntu)
    # Pinned for the same reason as the matrix above.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@cargo-llvm-cov
      - name: Install a software Vulkan driver for GPU tests
        run: sudo apt-get update && sudo apt-get install -y mesa-vulkan-drivers libvulkan1 vulkan-tools
      - name: Test with coverage
        run: cargo llvm-cov --workspace --lcov --output-path target/lcov.info
      - name: Coverage summary
        run: cargo llvm-cov report --summary-only
      - uses: actions/upload-artifact@v4
        with:
          name: coverage-lcov
          path: target/lcov.info
