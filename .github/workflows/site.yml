name: Site

on:
  push:
    branches: [main]
    paths:
      - 'site/**'
      - 'docs/**'
      - 'crates/**'
      - 'examples/web-mln/**'
      - 'examples/json/**'
      - '.github/workflows/site.yml'
  workflow_dispatch:

# One deployment at a time, and let a newer push finish rather than cancelling it
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: site/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      # The CLI has to be the exact version of the crate mln-rs pins, and wasm-opt
      # takes the module from 12 MB to 8.6 MB.
      - uses: taiki-e/install-action@v2
        with:
          tool: wasm-bindgen@0.2.130
      - run: sudo apt-get update && sudo apt-get install -y binaryen
      # Into site/public, so `npm run build` copies it into dist. It has to run first.
      - name: Build the live demos
        run: ./build.sh ../../site/public/demos
        working-directory: examples/web-mln
      - run: npm ci
        working-directory: site
      - run: npm run build
        working-directory: site
      # The API reference goes under /api, with an index that jumps into the main crate
      - run: cargo doc --no-deps -p mathgl -p lumagl -p deckgl -p deckgl-layers -p deckgl-json
      - name: Put the API reference in the site
        run: |
          cp -r target/doc site/dist/api
          echo '<meta http-equiv="refresh" content="0; url=deckgl/index.html">' > site/dist/api/index.html
      - uses: actions/upload-pages-artifact@v4
        with:
          path: site/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
