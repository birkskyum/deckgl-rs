[package]
name = "deckgl-ffi"
description = "C ABI for deckgl-rs: embed deck.gl layers in a host renderer such as maplibre-native"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true

[lib]
name = "deckgl_ffi"
crate-type = ["staticlib", "cdylib", "rlib"]

[dependencies]
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
deckgl-rs = { workspace = true, features = ["png"] }
deckgl-layers = { workspace = true }
deckgl-json = { workspace = true }
arrow-array = { workspace = true, features = ["ffi"] }
arrow-schema = { workspace = true, features = ["ffi"] }
deckgl-examples = { path = "../../examples" }
wgpu = { workspace = true }
pollster = { workspace = true }

[target.'cfg(any(target_os = "macos", target_os = "ios"))'.dependencies]
objc2 = "0.6"
objc2-metal = "0.3"

[dev-dependencies]
image = { workspace = true }
